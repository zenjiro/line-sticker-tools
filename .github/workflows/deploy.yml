name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sticker-gui/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: sticker-gui

      - name: Build
        run: npm run build
        working-directory: sticker-gui

      - name: Determine Target Folder
        id: target
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "folder=pr-preview/${{ github.event.number }}" >> $GITHUB_OUTPUT
          else
            echo "folder=." >> $GITHUB_OUTPUT
          fi

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: sticker-gui/dist
          target-folder: ${{ steps.target.outputs.folder }}
          clean: ${{ github.event_name != 'pull_request' }} # Only clean on main deployment to root, otherwise we wipe PRs
          clean-exclude: pr-preview/ # When cleaning root, don't wipe pr-preview folder
