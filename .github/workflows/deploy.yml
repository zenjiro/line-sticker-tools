name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sticker-gui/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: sticker-gui

      - name: Build
        run: npm run build
        working-directory: sticker-gui

      - name: Determine Target Folder
        id: target
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "folder=pr-preview/${{ github.event.number }}" >> $GITHUB_OUTPUT
          else
            echo "folder=." >> $GITHUB_OUTPUT
          fi

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: sticker-gui/dist
          target-folder: ${{ steps.target.outputs.folder }}
          clean: ${{ github.event_name != 'pull_request' }} # Only clean on main deployment to root, otherwise we wipe PRs
          clean-exclude: pr-preview/ # When cleaning root, don't wipe pr-preview folder

      - name: Create Deployment Status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-preview/${context.issue.number}/`;
            
            // Create deployment
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'pr-preview',
              auto_merge: false,
              required_contexts: [],
              transient_environment: true
            });
            
            // Create Deployment Status
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: deployUrl,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Preview is ready!'
            });
