<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE Sticker Tools</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="LINEスタンプ作成を支援するツール群">
</head>

<body>
    <div class="app">
        <div class="app-header">
            <h1>LINE Sticker Tools</h1>
            <div class="header-controls">
                <button id="lang-toggle" aria-label="Toggle Language">EN</button>
                <button id="theme-toggle" aria-label="Toggle Theme">🌙</button>
            </div>
        </div>

        <main class="main-area">
            <div class="container">
                <header>
                    <h1 data-i18n="title">LINE Sticker Tools</h1>
                    <p class="subtitle" data-i18n="subtitle">スタンプ作成を効率化するための専用ツールセット</p>
                </header>

                <div class="card-grid">
                    <a href="./remove-bg/" class="card">
                        <div class="card-content">
                            <span class="card-icon">🎨</span>
                            <h2 data-i18n="removeBgTitle">Remove BG GUI</h2>
                            <p data-i18n="removeBgDesc">画像の背景を簡単に除去・調整できます。</p>
                            <div class="card-arrow" data-i18n="openTool">Open Tool →</div>
                        </div>
                    </a>

                    <a href="./divide-crop/" class="card">
                        <div class="card-content">
                            <span class="card-icon">✂️</span>
                            <h2 data-i18n="divideCropTitle">Divide & Crop GUI</h2>
                            <p data-i18n="divideCropDesc">画像を自動で分割・切り抜きします。</p>
                            <div class="card-arrow" data-i18n="openTool">Open Tool →</div>
                        </div>
                    </a>

                    <a href="./arrange/" class="card">
                        <div class="card-content">
                            <span class="card-icon">📦</span>
                            <h2 data-i18n="arrangeTitle">Arrange GUI</h2>
                            <p data-i18n="arrangeDesc">スタンプの並び替えとパッケージングを行います。</p>
                            <div class="card-arrow" data-i18n="openTool">Open Tool →</div>
                        </div>
                    </a>
                </div>
            </div>
        </main>
        <footer>
            <div class="footer-content">←→:選択 / Enter/Space:決定</div>
        </footer>
    </div>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = Array.from(document.querySelectorAll('.card'));
            if (cards.length === 0) return;

            let focusIndex = 0;
            cards[0].focus();

            const updateFocus = (newIndex) => {
                if (newIndex < 0) newIndex = cards.length - 1;
                if (newIndex >= cards.length) newIndex = 0;
                focusIndex = newIndex;
                cards[focusIndex].focus();
            };

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    updateFocus(focusIndex + 1);
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    updateFocus(focusIndex - 1);
                }
            });

            cards.forEach((card, index) => {
                card.addEventListener('mouseenter', () => {
                    focusIndex = index;
                    card.focus();
                });
            });
        });
    </script>
</body>

</html>
