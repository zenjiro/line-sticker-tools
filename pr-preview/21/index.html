<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE Sticker Tools</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="LINEスタンプ作成を支援するツール群">
</head>

<body>
    <div class="container">
        <header>
            <h1>LINE Sticker Tools</h1>
            <p class="subtitle">スタンプ作成を効率化するための専用ツールセット</p>
        </header>

        <div class="card-grid">
            <a href="./remove-bg/" class="card">
                <div class="card-content">
                    <span class="card-icon">🎨</span>
                    <h2>Remove BG GUI</h2>
                    <p>画像の背景を簡単に除去・調整できます。</p>
                    <div class="card-arrow">Open Tool →</div>
                </div>
            </a>

            <a href="./divide-crop/" class="card">
                <div class="card-content">
                    <span class="card-icon">✂️</span>
                    <h2>Divide & Crop GUI</h2>
                    <p>画像を自動で分割・切り抜きします。</p>
                    <div class="card-arrow">Open Tool →</div>
                </div>
            </a>

            <a href="./arrange/" class="card">
                <div class="card-content">
                    <span class="card-icon">📦</span>
                    <h2>Arrange GUI</h2>
                    <p>スタンプの並び替えとパッケージングを行います。</p>
                    <div class="card-arrow">Open Tool →</div>
                </div>
            </a>
        </div>
    </div>
    <footer>
        <div class="footer-content">
            ←→:選択 / Enter/Space:決定
        </div>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = Array.from(document.querySelectorAll('.card'));
            if (cards.length === 0) return;

            let focusIndex = 0;

            // Set initial focus
            cards[0].focus();

            const updateFocus = (newIndex) => {
                // Wrap around logic
                if (newIndex < 0) newIndex = cards.length - 1;
                if (newIndex >= cards.length) newIndex = 0;

                focusIndex = newIndex;
                cards[focusIndex].focus();
            };

            document.addEventListener('keydown', (e) => {
                const key = e.key;

                if (key === 'ArrowRight') {
                    e.preventDefault();
                    updateFocus(focusIndex + 1);
                } else if (key === 'ArrowLeft') {
                    e.preventDefault();
                    updateFocus(focusIndex - 1);
                }
            });

            // Allow mouse hover to update focus index so keyboard takes over smoothly
            cards.forEach((card, index) => {
                card.addEventListener('mouseenter', () => {
                    focusIndex = index;
                    card.focus();
                });
            });
        });
    </script>
</body>

</html>
